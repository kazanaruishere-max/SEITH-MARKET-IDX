name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: ["handoff/**", "test/**"]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test -- --nocapture

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  python-kronos:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/kronos-sidecar
    env:
      KRONOS_MOCK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev || uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q --cov

  python-analysis:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/analysis
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev || uv sync
      - run: uv run ruff check . || echo "ruff not configured"
      - run: uv run pytest -q || echo "no tests yet"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm --dir apps/web install || echo "install pending"
      - run: pnpm --dir apps/web lint || echo "lint pending"
      - run: pnpm --dir apps/web typecheck || pnpm --dir apps/web exec tsc --noEmit || echo "typecheck pending"
