[project]
name = "kronos-sidecar"
version = "0.1.0"
description = "Kronos-base inference HTTP bridge :8001"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "torch",
]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9"]
