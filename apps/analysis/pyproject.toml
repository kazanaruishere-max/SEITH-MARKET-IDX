[project]
name = "seith-analysis"
version = "0.1.0"
description = "TradingAgents-Lite 3-agent (Fund/Tech/Synth) -> 9router :8002"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.9",
]
